<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Formulário</title>
    <style>
        *{
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif
        }
    </style>
</head>
<body>
    <h1>Teste do formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p><label for="inome">Nome: </label><input type="text" name="nome" id="inome" required minlength="5" maxlength="10" autocomplete="username"></p>
        <p><label for="isobrenome">Sobrenome: </label><input type="text" name="sobrenome" id="isobrenome" placeholder="sobrenome pequeno"></p>
        <p><label for="imes">Mês de aniversário: </label><input type="month" name="Mês" id="imes"></p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">


    </form>
</body>
</html>
